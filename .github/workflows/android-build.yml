# Builds the JainJoy Android app on GitHub's free computers.
# Every time the android-app branch changes, a fresh test APK appears under
# Actions -> "Build JainJoy Android app" -> the latest run -> Artifacts.
name: Build JainJoy Android app

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Copy the web app into the Android project
        run: |
          npm ci
          npm run android:sync

      - name: Build the test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: JainJoy-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Put the APK on an easy download page (test build, not the Play Store)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JainJoy-test.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test JainJoy-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "JainJoy Android test build" \
            --notes "Test version of the JainJoy Android app, for installing directly on a phone or tablet. Not the Play Store version."
