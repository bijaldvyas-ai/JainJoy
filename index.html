<style>
/* Layout: one phone-width app column (full screen on phones, framed on desktop): top bar, scrolling screen, bottom tab bar. Mind-map palette: navy wordmark, lotus crimson, saffron for Aatham/Chaudas, green for checks. */
:root{
  --stage:#efe9f7;
  --bg:#f6f3fb;
  --surface:#ffffff;
  --surface-2:#faf8fe;
  --fg:#1d1b40;
  --muted:#6c6890;
  --line:#ebe6f4;
  --navy:#2b2a6e;
  --crimson:#e5195b;
  --on-crimson:#ffffff;
  --pink-soft:#fde6ef;
  --green:#1e9b56;
  --on-green:#ffffff;
  --green-soft:#e2f5ea;
  --saffron:#d97800;
  --on-saffron:#ffffff;
  --saffron-soft:#fff1da;
  --indigo:#4a42c6;
  --indigo-soft:#ebe9fc;
  --plate:#ffffff;
  --plate-line:#e9e4f2;
  --plate-in:#f6f2fb;
  --plate-shadow:rgba(43,42,110,.10);
  --shadow:0 10px 28px -16px rgba(43,42,110,.35);
  --scrim:rgba(20,16,50,.45);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#0b0a1c;--bg:#131029;--surface:#1c1938;--surface-2:#221e43;--fg:#f0edfb;--muted:#a8a3cc;--line:#2e2a52;
    --navy:#cfccff;--crimson:#ff5b93;--on-crimson:#24061a;--pink-soft:#3a1d36;--green:#4fd38c;--on-green:#08281a;--green-soft:#173628;
    --saffron:#ffad3d;--on-saffron:#2b1800;--saffron-soft:#382a13;--indigo:#aaa4ff;--indigo-soft:#27244f;
    --plate:#2a2650;--plate-line:#3a3566;--plate-in:#231f47;--plate-shadow:rgba(0,0,0,.35);--shadow:0 12px 30px -16px rgba(0,0,0,.7);--scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#0b0a1c;--bg:#131029;--surface:#1c1938;--surface-2:#221e43;--fg:#f0edfb;--muted:#a8a3cc;--line:#2e2a52;
  --navy:#cfccff;--crimson:#ff5b93;--on-crimson:#24061a;--pink-soft:#3a1d36;--green:#4fd38c;--on-green:#08281a;--green-soft:#173628;
  --saffron:#ffad3d;--on-saffron:#2b1800;--saffron-soft:#382a13;--indigo:#aaa4ff;--indigo-soft:#27244f;
  --plate:#2a2650;--plate-line:#3a3566;--plate-in:#231f47;--plate-shadow:rgba(0,0,0,.35);--shadow:0 12px 30px -16px rgba(0,0,0,.7);--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;justify-content:center}
.phone{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:640px){
  body{background:radial-gradient(circle at 12% 18%,var(--pink-soft),transparent 42%),radial-gradient(circle at 88% 82%,var(--green-soft),transparent 40%),var(--stage)}
  #app{align-items:center;padding-block:20px}
  .phone{max-width:410px;max-height:880px;border-radius:40px;border:1px solid var(--line);box-shadow:0 40px 90px -40px rgba(43,42,110,.55)}
}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:4px 28px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2.5px solid var(--crimson);outline-offset:2px}

/* brand */
.lotus{flex:none}
.wm{font-family:var(--display);font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1}
.wm em{font-style:normal;color:var(--crimson)}

/* top bar */
.appbar{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;background:var(--bg);flex:none}
.brand-sm{display:flex;align-items:center;gap:6px}
.brand-sm .wm{font-size:24px}
.city-chip{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:6px 10px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;max-width:55%}
.city-chip .ic{width:16px;height:16px;color:var(--crimson)}
.city-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:disabled{opacity:.35;cursor:default}
.ab-title{display:flex;flex-direction:column;min-width:0;flex:1}
.ab-title b{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title small{font-size:12.5px;color:var(--muted);font-weight:600}
.ab-nav{display:flex;gap:6px}

/* type */
.eyebrow{margin:8px 2px 0;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--crimson)}
.h1{font-family:var(--display);font-weight:800;font-size:29px;line-height:1.1;letter-spacing:-.01em;margin:2px 2px 4px;color:var(--navy);text-wrap:balance}
.sub{margin:0 2px 14px;color:var(--muted);font-weight:600;font-size:14px}
.h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px}
.h2 span{letter-spacing:0;text-transform:none;font-size:12.5px}
.fine{font-size:12.5px;color:var(--muted);margin:14px 2px 0}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800;line-height:1.2}
.badge .ic{width:14px;height:14px;stroke-width:2.4}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-warn{background:var(--saffron-soft);color:var(--saffron)}
.b-bad{background:var(--pink-soft);color:var(--crimson)}
.b-plain{background:var(--surface);color:var(--muted);border:1px solid var(--line)}

/* tithi card */
.tcard{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-top:6px}
.tcard.sp{background:var(--saffron-soft);border:1.5px solid var(--saffron)}
.tbox{width:58px;flex:none;border-radius:14px;overflow:hidden;text-align:center;background:var(--surface);border:1.5px solid var(--saffron)}
.tbox span{display:block;background:var(--saffron);color:var(--on-saffron);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 0}
.tbox b{display:block;font-family:var(--display);font-size:26px;font-weight:800;color:var(--fg);padding:2px 0 3px;font-variant-numeric:tabular-nums}
.tinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.tinfo b{font-size:17px;font-weight:800}
.tinfo small{color:var(--muted);font-weight:600;font-size:12.5px}
.rule-note{display:flex;gap:10px;align-items:flex-start;margin:10px 2px 0;font-size:13px;color:var(--muted);font-weight:600}
.rule-note .ic{width:18px;height:18px;color:var(--green);margin-top:1px}
.rule-note.sp .ic{color:var(--saffron)}
.rule-note b{color:var(--fg)}

/* meals */
.meals{display:grid;gap:10px;margin-top:16px}
.meal{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px 10px 10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.meal:active{transform:scale(.985)}
.meal .plate{flex:none}
.mtxt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mtxt b{font-size:16px;font-weight:800;line-height:1.25}
.mtxt small{font-size:12.5px;color:var(--muted);font-weight:600}
.mtag{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.mt-b{color:var(--saffron);background:var(--saffron-soft)}
.mt-l{color:var(--green);background:var(--green-soft)}
.mt-s{color:var(--crimson);background:var(--pink-soft)}
.mt-d{color:var(--indigo);background:var(--indigo-soft)}
.chev{color:var(--muted);width:18px;height:18px}
.warn-line{font-size:12px;font-weight:800;color:var(--crimson)}
.daysum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 2px 0;font-size:12.5px;color:var(--muted);font-weight:700}
.empty{margin-top:16px;padding:22px 18px;border-radius:22px;background:var(--surface);border:1px dashed var(--line);text-align:center;color:var(--muted);font-weight:600}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.linkbtn{background:none;border:0;color:var(--crimson);font-weight:800;cursor:pointer;padding:6px 2px;font-size:13.5px}

/* recipe */
.rhero{display:grid;place-items:center;padding:14px 0;border-radius:28px;margin-top:4px}
.rhero.mt-b{background:var(--saffron-soft)}.rhero.mt-l{background:var(--green-soft)}.rhero.mt-s{background:var(--pink-soft)}.rhero.mt-d{background:var(--indigo-soft)}
.rname{margin-top:14px}
.alert{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--pink-soft);color:var(--crimson);font-weight:700;font-size:13.5px}
.nut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.nut div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.nut b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.nut small{font-size:11px;color:var(--muted);font-weight:700}
.ings{list-style:none;margin:0;padding:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.ings li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.ings li:last-child{border-bottom:0}
.ings span{min-width:0}
.ings b{font-variant-numeric:tabular-nums;white-space:nowrap}
.leafy-tag{margin-left:6px;font-size:10.5px;font-weight:800;color:var(--green);background:var(--green-soft);padding:1px 6px;border-radius:999px;vertical-align:1px}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:grid;gap:10px}
.steps li{counter-increment:st;position:relative;padding:12px 14px 12px 52px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.steps li::before{content:counter(st);position:absolute;left:12px;top:11px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pink-soft);color:var(--crimson);font-weight:800;font-size:13px}

/* calendar */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 2px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.calwrap{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 10px;box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding-bottom:4px}
.cd{min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;padding:3px 0;min-width:0}
.cd b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.cd small{font-size:8.5px;font-weight:800;color:var(--muted);letter-spacing:.01em;white-space:nowrap;overflow:hidden;max-width:100%}
.cd.sp{background:var(--saffron-soft);border:1.5px solid var(--saffron)}
.cd.sp small{color:var(--saffron)}
.cd.past{opacity:.55}
.cd.today{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson);opacity:1}
.cd.today small{color:var(--on-crimson)}
.cd.today.sp{box-shadow:0 0 0 2.5px var(--saffron)}
.cd.pre{opacity:.28;cursor:default}
.cd.blank{visibility:hidden}
.splist{display:grid;gap:8px}
.sprow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:left;cursor:pointer}
.sprow .dnum{width:44px;height:44px;flex:none;border-radius:14px;background:var(--saffron-soft);color:var(--saffron);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.sprow .dnum b{font-size:17px}
.sprow .dnum small{font-size:10px}
.sprow.past{opacity:.6}

/* grocery */
.gtop{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ring{--p:0;width:52px;height:52px;flex:none;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.gtop .tinfo{flex:1}
.gactions{display:flex;gap:8px;margin-top:10px}
.gbtn{flex:1;min-height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.gbtn .ic{width:18px;height:18px}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px;margin-top:12px}
.gsec h3{margin:10px 0 2px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.gi{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);cursor:pointer}
.gi:last-child{border-bottom:0}
.gi input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--line);background:var(--surface-2);margin:0;cursor:pointer;display:grid;place-items:center}
.gi input:checked{background:var(--green);border-color:var(--green)}
.gi input:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--on-green);border-bottom:2.5px solid var(--on-green);transform:translateY(-1px) rotate(-45deg)}
.gn{flex:1;min-width:0;font-weight:700}
.gq{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.gi input:checked~.gn,.gi input:checked~.gq{text-decoration:line-through;color:var(--muted)}

/* profile form */
.hero-brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 0 6px}
.hero-brand .wm{font-size:40px;margin-top:2px}
.hero-brand .h1{margin-top:14px;font-size:24px}
.frows{display:grid;gap:10px;margin-top:6px}
.frow{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.frow.open{border-color:var(--crimson);box-shadow:var(--shadow)}
.frow-h{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;background:none;border:0;text-align:left;min-height:62px;cursor:pointer}
.frow-h.static{cursor:default}
.ficon{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--pink-soft);color:var(--crimson)}
.ftext{display:flex;flex-direction:column;min-width:0;flex:1}
.ftext b{font-size:15.5px;font-weight:800}
.ftext small{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcheck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.fcheck .ic{width:15px;height:15px;stroke-width:3}
.done .fcheck{background:var(--green);border-color:var(--green);color:var(--on-green)}
.frow-b{padding:2px 14px 16px}
.hint{font-size:12.5px;color:var(--muted);font-weight:600;margin:10px 2px 0}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:800;font-size:15px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson)}
.chip.custom{background:var(--pink-soft);border-color:transparent;color:var(--crimson)}
.select{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-weight:700;padding:0 12px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.stepper button{width:46px;height:46px;border-radius:12px;border:0;background:var(--surface);font-size:22px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.stepper button:disabled{opacity:.35}
.stepper output{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;padding:0 12px}
.addrow button{min-height:44px;padding:0 16px;border-radius:14px;border:0;background:var(--navy);color:var(--bg);font-weight:800;cursor:pointer}
.switch{margin-left:auto;width:46px;height:28px;border-radius:999px;background:var(--green);position:relative;flex:none}
.switch::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--on-green)}
.cta-bar{flex:none;padding-block:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.btn-primary{width:100%;min-height:54px;border-radius:18px;border:0;background:var(--crimson);color:var(--on-crimson);font-weight:800;font-size:16.5px;cursor:pointer;box-shadow:0 12px 26px -12px var(--crimson)}
.btn-primary:disabled{opacity:.4;box-shadow:none;cursor:default}
.cta-bar p{margin:8px 4px 0;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
.about{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 14px}
.about div{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.about div:last-child{border-bottom:0}
.about .ic{width:18px;height:18px;color:var(--crimson);margin-top:1px}
.btn-danger{width:100%;min-height:48px;margin-top:12px;border-radius:16px;border:1.5px solid var(--crimson);background:transparent;color:var(--crimson);font-weight:800;cursor:pointer}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-block:6px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px 0;font-size:11.5px;font-weight:800;color:var(--muted);cursor:pointer;min-height:52px}
.tab .pill{width:52px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--crimson)}
.tab[aria-current="page"] .pill{background:var(--pink-soft)}

/* sheet, toast, splash */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:40}
.sheet{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding-block:22px 20px}
.sheet h2{margin:0 0 6px;font-family:var(--display);font-size:22px;color:var(--navy)}
.sheet p{margin:0 0 16px;color:var(--muted);font-weight:600}
.sheet .row{display:flex;gap:10px}
.sheet .row button{flex:1;min-height:50px;border-radius:16px;font-weight:800;cursor:pointer;border:1.5px solid var(--line);background:var(--surface-2)}
.sheet .row .go{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:13.5px;max-width:calc(100% - 32px);width:max-content;z-index:60;transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.splash .lotus{animation:bloom 1.4s ease-in-out infinite}
.splash .wm{font-size:38px}
.splash p{color:var(--muted);font-weight:700;margin:6px 0 0}
@keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const MEALS=['b','l','s','d'];
const MEAL={b:'Breakfast',l:'Lunch',s:'Snack',d:'Dinner'};
const RECIPES=[],RBYID={};
// Compliance pipeline: every recipe is checked against ingredient flags before it can enter a plan.
RAW.forEach(([id,meal,name,min,ingStr,steps])=>{
 const ings=ingStr.trim().split(/\s+/).map(t=>{const p=t.split(':');return{id:p[0],q:parseFloat(p[1])};});
 const problems=[];let leafy=false;const alg=new Set();const nut=[0,0,0,0];const w=[];let base=null,bq=0,veg=null,vq=0;
 ings.forEach(x=>{
  const g=ING[x.id];if(!g||!(x.q>0)){problems.push('Unknown ingredient '+x.id);return;}
  if(!g.is_jain)problems.push(g.name+' is not Jain-allowed');
  if(g.is_leafy)leafy=true;g.alg.forEach(a=>alg.add(a));
  const grams=x.q*(g.unit==='pcs'?g.pg:1);for(let i=0;i<4;i++)nut[i]+=g.n[i]*grams/100;
  if(g.cat!=='S'&&g.col)w.push([grams,g.col]);
  if((g.cat==='G'||g.cat==='P')&&grams>bq){bq=grams;base=x.id;}
  if(g.cat==='V'&&!['tomato','chilli','lemon','coriander'].includes(x.id)&&grams>vq){vq=grams;veg=x.id;}});
 w.sort((a,b)=>b[0]-a[0]);const pal=[];w.forEach(x=>{if(pal.length<5&&pal.indexOf(x[1])<0)pal.push(x[1]);});
 const r={id,meal,name,min,ings,steps,leafy,alg,base,veg,pal,nut:nut.map(v=>Math.round(v)),ok:problems.length===0,problems,
  names:ings.map(x=>ING[x.id]?ING[x.id].name.toLowerCase():'').join('|')};
 RECIPES.push(r);RBYID[id]=r;});

function hits(r,p){const out=[];(p.allergies||[]).forEach(a=>{if(r.alg.has(a))out.push(ALG[a]);});
 (p.custom||[]).forEach(word=>{const k=String(word).toLowerCase().trim();if(k.length>1&&r.names.indexOf(k)>=0)out.push(word);});return out;}

/* ================= Meal plan generator ================= */
let GEN=new Map(),GENKEY='';
function profKey(p){return[p.tradition,p.subsect,p.city,p.hh,(p.allergies||[]).join(','),(p.custom||[]).join(','),p.planFrom].join('|');}
function histFor(iso){const h=new Map();for(let k=7;k>=1;k--){const d=addDays(iso,-k);const m=S.menus[d]||GEN.get(d);if(m)MEALS.forEach(x=>h.set(m[x],dayNum(d)));}return h;}
function genDay(iso,hist){
 const p=S.profile,info=tithiInfo(iso,p.city),special=!!info.special,dn=dayNum(iso),month=partsOf(iso)[1];
 const m={hh:p.hh,special};const chosen=[];
 MEALS.forEach(meal=>{
  const all=RECIPES.filter(r=>r.meal===meal&&r.ok);
  const rule=special?all.filter(r=>!r.leafy):all; // Aatham/Chaudas rule can never be relaxed
  let pool=rule.filter(r=>hits(r,p).length===0);
  if(!pool.length&&rule.length){const mn=Math.min.apply(null,rule.map(r=>hits(r,p).length));pool=rule.filter(r=>hits(r,p).length===mn);}
  if(!pool.length)pool=rule.length?rule:all;
  let best=null,bs=Infinity;
  pool.forEach(r=>{
   const last=hist.get(r.id),age=last==null?30:Math.min(30,dn-last);
   let s=(age<7?1000-age*10:0)-age;
   s+=r.ings.filter(x=>!inSeason(ING[x.id],month)).length*15;
   chosen.forEach(c=>{if(c.veg&&c.veg===r.veg)s+=35;if((meal==='d'||meal==='l')&&c.base&&c.base===r.base&&(c.meal==='l'||c.meal==='d'))s+=25;});
   s+=hash(iso+r.id)%9;
   if(s<bs){bs=s;best=r;}});
  m[meal]=best.id;chosen.push(best);});
 return m;}
function ensureGen(iso){
 const p=S.profile,k=profKey(p);if(k!==GENKEY){GEN=new Map();GENKEY=k;}
 for(let d=p.planFrom;d<=iso;d=addDays(d,1)){if(!GEN.has(d))GEN.set(d,S.menus[d]||genDay(d,histFor(d)));}}
function menuFor(iso){
 if(S.menus[iso])return S.menus[iso];
 const p=S.profile,t=todayISO();let m;
 if(iso<p.planFrom)m=genDay(iso,histFor(iso));else{ensureGen(iso);m=GEN.get(iso);}
 if(iso<=t){S.menus[iso]=m;persist();} // today and past menus are frozen
 return m;}
function nextSpecial(iso,city){for(let k=1;k<=17;k++){const d=addDays(iso,k),i=tithiInfo(d,city);if(i.special)return{d,label:i.special};}return null;}

/* ================= Grocery list ================= */
function grocery(){
 const p=S.profile,t=todayISO(),acc={};
 for(let k=0;k<7;k++){const d=addDays(t,k);if(d<p.created)continue;const m=menuFor(d);
  MEALS.forEach(x=>{RBYID[m[x]].ings.forEach(i=>{acc[i.id]=(acc[i.id]||0)+i.q*m.hh;});});}
 const groups=CAT_ORDER.map(c=>({c,items:Object.keys(acc).filter(id=>ING[id].cat===c).map(id=>({id,name:ING[id].name,q:acc[id],unit:ING[id].unit})).sort((a,b)=>a.name.localeCompare(b.name))})).filter(g=>g.items.length);
 return{from:t,to:addDays(t,6),groups};}
function bigUnit(unit,v){if(v>=1000){const k=Math.round(v/10)/100;return k+(unit==='ml'?' litre':' kg');}return v+' '+unit;}
function frac(q){const r=Math.max(.5,Math.round(q*2)/2),w=Math.floor(r),h=r-w>0;return(w?String(w):'')+(h?'½':'');}
function fmtRecipe(unit,q){
 if(unit==='pcs')return frac(q)+(q>1?' pcs':' pc');
 const v=q<10?Math.round(q*10)/10:q<50?Math.round(q):Math.round(q/5)*5;return bigUnit(unit,v);}
function fmtBuy(unit,q){
 if(unit==='pcs'){const n=Math.max(1,Math.ceil(q-1e-9));return n+(n>1?' pcs':' pc');}
 const step=q<50?5:q<200?10:q<1000?50:100;return bigUnit(unit,Math.ceil(q/step-1e-9)*step);}
function checked(id){const v=S.checks[id];return !!v&&dayNum(todayISO())-dayNum(v)<7;}

 let b='<div class="rhero mt-'+top.meal+'">'+plate(r,150)+'</div><h1 class="h1 rname">'+esc(r.name)+'</h1><div class="badges">'+
  '<span class="badge b-ok">'+ic('check')+'Jain compliant</span>'+
  (r.leafy?'<span class="badge b-plain">'+ic('leaf')+'Has leafy veg · regular days only</span>':'<span class="badge b-warn">'+ic('noleaf')+'Aatham & Chaudas safe</span>')+
  '<span class="badge b-plain">'+ic('clock')+r.min+' min</span><span class="badge b-plain">'+ic('users')+'Serves '+hh+'</span></div>';
 if(h.length)b+='<div class="alert">Contains '+esc(h.join(', '))+', which is on your allergy list. Check before cooking.</div>';
 b+='<div class="nut"><div><b>'+r.nut[0]+'</b><small>kcal</small></div><div><b>'+r.nut[1]+' g</b><small>protein</small></div><div><b>'+r.nut[2]+' g</b><small>carbs</small></div><div><b>'+r.nut[3]+' g</b><small>fat</small></div></div>';
 b+='<h2 class="h2">Ingredients<span>for '+hh+(hh>1?' members':' member')+'</span></h2><ul class="ings">'+
  r.ings.map(x=>{const g=ING[x.id];return '<li><span>'+esc(g.name)+(g.is_leafy?'<span class="leafy-tag">leafy</span>':'')+'</span><b>'+fmtRecipe(g.unit,x.q*hh)+'</b></li>';}).join('')+'</ul>';
 b+='<h2 class="h2">Method</h2><ol class="steps">'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>';
 b+='<p class="fine">Nutrition is approximate, per serving. Salt and spices can be adjusted to taste.</p>';
 return head+'<main class="scroll gx" id="scroll">'+b+'</main>';}

/* ---------- Calendar ---------- */
function viewCal(){
 const p=S.profile,t=todayISO(),[y,m]=partsOf(t),first=monthStart(t),last=monthEnd(t);
 let g='<div class="cal">'+DOW.map(d=>'<div class="dh">'+d+'</div>').join('');
 for(let i=0;i<dow(first);i++)g+='<div class="cd blank"></div>';
 const specials=[];
 for(let d=first;d<=last;d=addDays(d,1)){
  const info=tithiInfo(d,p.city),pre=d<p.created,day=partsOf(d)[2];
  if(info.special)specials.push([d,info]);
  const cls='cd'+(info.special?' sp':'')+(d<t?' past':'')+(d===t?' today':'')+(pre?' pre':'');
  const lab=info.special||(info.n===15?(info.paksha==='Shukla'?'Punam':'Amas'):(info.paksha[0]+info.n));
  const aria=fmtDate(d,true)+', '+info.paksha+' '+tithiName(info,p.tradition)+(info.special?', '+info.special:'')+(d<t?', read-only':'');
  g+=pre?'<div class="'+cls+'" aria-label="'+esc(aria)+'"><b>'+day+'</b><small>'+lab+'</small></div>':'<button class="'+cls+'" data-a="day" data-v="'+d+'" aria-label="'+esc(aria)+'"><b>'+day+'</b><small>'+lab+'</small></button>';}
 g+='</div>';
 let b='<h1 class="h1" style="margin-top:6px">'+MONTHS[m-1]+' '+y+'</h1><p class="sub">Tithi at sunrise in '+esc(p.city)+' · current month</p>'+
  '<div class="legend"><span><i style="background:var(--crimson)"></i>Today</span><span><i style="background:var(--saffron)"></i>Aatham / Chaudas</span><span>S = Shukla, K = Krishna</span></div>'+
  '<div class="calwrap">'+g+'</div><p class="fine">Tap any day to see its menu. Past days are read-only.</p>';
 b+='<h2 class="h2">Aatham &amp; Chaudas this month<span>'+specials.length+' days</span></h2><div class="splist">'+specials.map(([d,info])=>{
  const pre=d<p.created;const inner='<span class="dnum"><b>'+partsOf(d)[2]+'</b><small>'+MON[m-1]+'</small></span><span class="mtxt"><b>'+info.special+'</b><small>'+fmtDate(d,true)+' · '+info.paksha+' paksha · no leafy vegetables</small></span>';
  return pre?'<div class="sprow past">'+inner+'</div>':'<button class="sprow'+(d<t?' past':'')+'" data-a="day" data-v="'+d+'">'+inner+ic('next','chev')+'</button>';}).join('')+'</div>';
 return brandBar()+'<main class="scroll gx" id="scroll">'+b+'</main>';}

/* ---------- Grocery ---------- */
function viewShop(){
 const G=grocery(),p=S.profile;let total=0,done=0;
 G.groups.forEach(gr=>gr.items.forEach(it=>{total++;if(checked(it.id))done++;}));
 const pct=total?Math.round(done*100/total):0;
 let b='<h1 class="h1" style="margin-top:6px">7-Day Grocery List</h1><p class="sub">'+fmtDate(G.from)+' – '+fmtDate(G.to)+' · '+p.hh+(p.hh>1?' members':' member')+'</p>'+
  '<div class="gtop"><div class="ring" id="ring" style="--p:'+pct+'"><span id="ringtxt">'+pct+'%</span></div><div class="tinfo"><b id="gcount">'+done+' of '+total+' items</b><small>Quantities follow the next 7 days of your plan and update when it changes.</small></div></div>'+
  '<div class="gactions"><button class="gbtn" data-a="copy">'+ic('copy')+'Copy list</button><button class="gbtn" data-a="clear">'+ic('undo')+'Clear ticks</button></div>';
 G.groups.forEach(gr=>{b+='<section class="gsec"><h3>'+CATS[gr.c]+'</h3>'+gr.items.map(it=>'<label class="gi"><input type="checkbox" id="g-'+it.id+'" data-tick="'+it.id+'"'+(checked(it.id)?' checked':'')+'><span class="gn">'+esc(it.name)+'</span><span class="gq">'+fmtBuy(it.unit,it.q)+'</span></label>').join('')+'</section>';});
 b+='<p class="fine">Rounded up to practical buying amounts.</p>';
 return brandBar()+'<main class="scroll gx" id="scroll">'+b+'</main>';}
function refreshShopCounts(){let total=0,done=0;document.querySelectorAll('[data-tick]').forEach(i=>{total++;if(i.checked)done++;});const pct=total?Math.round(done*100/total):0;
 const r=document.getElementById('ring');if(r)r.style.setProperty('--p',pct);const rt=document.getElementById('ringtxt');if(rt)rt.textContent=pct+'%';const gc=document.getElementById('gcount');if(gc)gc.textContent=done+' of '+total+' items';}
function listText(){const G=grocery();let s='JainJoy grocery list ('+fmtDate(G.from)+' – '+fmtDate(G.to)+')\n';G.groups.forEach(gr=>{s+='\n'+CATS[gr.c]+'\n';gr.items.forEach(it=>{s+=(checked(it.id)?'[x] ':'[ ] ')+it.name+' – '+fmtBuy(it.unit,it.q)+'\n';});});return s;}
function copyList(){const txt=listText();
 const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);toast(ok?'Grocery list copied':'Copy is blocked here. Long-press to select instead.');}catch(e){toast('Copy is blocked here. Long-press to select instead.');}};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Grocery list copied'),fallback);}else fallback();}catch(e){fallback();}}

/* ---------- Profile (onboarding + edit) ---------- */
function blankDraft(){return{tradition:'',subsect:'',city:'',hh:4,allergies:[],custom:[]};}
function profileFields(p){return{tradition:p.tradition,subsect:p.subsect,city:p.city,hh:p.hh,allergies:(p.allergies||[]).slice(),custom:(p.custom||[]).slice()};}
function ready(d){return !!(d.tradition&&d.subsect&&d.city&&d.hh>=1);}
function frow(key,icon,title,value,done,bodyFn){
 const open=openField===key;
 return '<section class="frow'+(open?' open':'')+(done?' done':'')+'"><button class="frow-h" data-a="field" data-v="'+key+'" aria-expanded="'+open+'"><span class="ficon">'+ic(icon)+'</span><span class="ftext"><b>'+title+'</b><small>'+value+'</small></span><span class="fcheck">'+ic('check')+'</span></button>'+(open?'<div class="frow-b">'+bodyFn()+'</div>':'')+'</section>';}
function viewProfile(onboard){
 if(!draft){draft=onboard?blankDraft():profileFields(S.profile);if(onboard&&openField==null)openField='tradition';}
 const d=draft;
 const algVal=d.allergies.length||d.custom.length?esc(d.allergies.map(a=>ALG[a]).concat(d.custom).join(', ')):'None';
 let rows='';
 rows+=frow('tradition','home','Tradition',d.tradition||'Shwetambar or Digambar',!!d.tradition,()=>'<div class="opt2">'+['Shwetambar','Digambar'].map(v=>'<button class="opt" data-a="trad" data-v="'+v+'" aria-pressed="'+(d.tradition===v)+'">'+v+'</button>').join('')+'</div>');
 rows+=frow('subsect','sect','Sub-sect',d.subsect||'Murtipujak, Sthanakvasi, Terapanth…',!!d.subsect,()=>d.tradition?'<div class="chips">'+SUBS[d.tradition].map(v=>'<button class="chip" data-a="sub" data-v="'+v+'" aria-pressed="'+(d.subsect===v)+'">'+v+'</button>').join('')+'</div>':'<p class="hint" style="margin:0">Choose your tradition first.</p>');
 rows+=frow('city','pin','Location',d.city?esc(d.city):'City, for correct tithi calculation',!!d.city,()=>'<label for="city-select" class="hint" style="display:block;margin:0 0 8px">Your city sets the local sunrise used for each day’s tithi.</label><select class="select" id="city-select"><option value="">Select your city</option>'+CITY_GROUPS.map(g=>'<optgroup label="'+g[0]+'">'+g[1].map(c=>'<option'+(d.city===c[0]?' selected':'')+'>'+esc(c[0])+'</option>').join('')+'</optgroup>').join('')+'</select>');
 rows+=frow('hh','users','Household Size',d.hh+(d.hh>1?' members':' member'),d.hh>=1,()=>'<div class="stepper"><button data-a="hh" data-v="-1" aria-label="Fewer members"'+(d.hh<=1?' disabled':'')+'>−</button><output aria-live="polite">'+d.hh+(d.hh>1?' members':' member')+'</output><button data-a="hh" data-v="1" aria-label="More members"'+(d.hh>=20?' disabled':'')+'>+</button></div><p class="hint">Recipe quantities and the grocery list scale to this.</p>');
 rows+=frow('allergies','shield','Allergies',algVal,true,()=>'<div class="chips"><button class="chip" data-a="alg" data-v="none" aria-pressed="'+(!d.allergies.length&&!d.custom.length)+'">None</button>'+Object.keys(ALG).map(k=>'<button class="chip" data-a="alg" data-v="'+k+'" aria-pressed="'+(d.allergies.indexOf(k)>=0)+'">'+ALG[k]+'</button>').join('')+d.custom.map((w,i)=>'<button class="chip custom" data-a="rmcustom" data-v="'+i+'" aria-label="Remove '+esc(w)+'">'+esc(w)+' ×</button>').join('')+'</div><form class="addrow" id="custom-form" autocomplete="off"><input id="custom-allergy" maxlength="30" placeholder="Other ingredient, e.g. papaya" aria-label="Add another ingredient to avoid"><button type="submit">Add</button></form><p class="hint">Recipes containing these are left out of your plan.</p>');
 rows+='<section class="frow done"><div class="frow-h static"><span class="ficon">'+ic('lock')+'</span><span class="ftext"><b>Aatham &amp; Chaudas</b><small>Always ON · no leafy vegetables</small></span><span class="switch" role="img" aria-label="Always on"></span></div></section>';
 let head,top='',bottom='';
 if(onboard){
  top='<div class="hero-brand">'+lotus(78)+wordmark+'<h1 class="h1">Your Jain Profile</h1><p class="sub" style="margin:0">Asked once. Every menu is built from it.</p></div>';
  head='';
  bottom='<div class="cta-bar gx"><button class="btn-primary" data-a="submit"'+(ready(d)?'':' disabled')+'>Get My Meal Plan</button><p>'+(ready(d)?'Your plan starts today.':'Choose tradition, sub-sect and city to continue.')+'</p></div>';
 }else{
  const changed=JSON.stringify(profileFields(S.profile))!==JSON.stringify(d);
  head='<header class="appbar gx"><div class="ab-title"><b>Edit Profile</b><small>Changes apply from tomorrow</small></div></header>';
  const ok=RECIPES.filter(r=>r.ok).length;
  rows+='<h2 class="h2">About your plan</h2><div class="about">'+
   '<div>'+ic('check')+'<span><b>'+ok+' of '+RECIPES.length+' recipes</b> passed the Jain compliance check: no onion, garlic, root vegetables or other excluded ingredients.</span></div>'+
   '<div>'+ic('sun')+'<span>Tithi is calculated on this phone for sunrise in your city. For festival dates, follow your Sangh’s Panchang.</span></div>'+
   '<div>'+ic('phone')+'<span>To use JainJoy like an app, open your browser menu and choose <b>Add to Home Screen</b>.</span></div></div>'+
   '<button class="btn-danger" data-a="resetask">Reset JainJoy</button>';
  bottom='<div class="cta-bar gx"><button class="btn-primary" data-a="save"'+(changed&&ready(d)?'':' disabled')+'>Save Changes</button><p>Today’s and past menus stay as they are. Your new plan starts tomorrow.</p></div>';
 }
 return head+'<main class="scroll gx" id="scroll">'+top+'<div class="frows">'+rows+'</div></main>'+bottom;}

/* ---------- Sheet ---------- */
function sheetHTML(){if(sheet!=='reset')return'';
 return '<div class="scrim" data-a="sheetclose"><div class="sheet gx" role="dialog" aria-modal="true" aria-labelledby="sh-t" data-stop="1"><h2 id="sh-t">Reset JainJoy?</h2><p>This deletes your profile, menus and grocery ticks on this device. You will set up your profile again.</p><div class="row"><button data-a="sheetclose">Cancel</button><button class="go" data-a="resetdo">Reset</button></div></div></div>';}

/* ================= Events ================= */
app.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 if(el.dataset.a==='sheetclose'&&e.target.closest('[data-stop]')&&e.target!==el&&!e.target.closest('button'))return;
 const a=el.dataset.a,v=el.dataset.v;
 switch(a){
  case'tab':tab=v;stack=[];if(v==='prof'){draft=null;openField=null;}render();break;
  case'back':stack.pop();render();break;
  case'day':stack.push({k:'day',date:v});render();break;
  case'shift':{const top=stack[stack.length-1];if(top){top.date=addDays(top.date,+v);render();}break;}
  case'recipe':stack.push({k:'recipe',date:el.dataset.d,meal:el.dataset.m});render();break;
  case'field':openField=openField===v?null:v;render();break;
  case'trad':draft.tradition=v;if(SUBS[v].indexOf(draft.subsect)<0)draft.subsect='';if(!S.profile)openField='subsect';render();break;
  case'sub':draft.subsect=v;if(!S.profile)openField=draft.city?null:'city';render();break;
  case'hh':draft.hh=Math.max(1,Math.min(20,draft.hh+(+v)));render();break;
  case'alg':if(v==='none'){draft.allergies=[];draft.custom=[];}else{const i=draft.allergies.indexOf(v);if(i>=0)draft.allergies.splice(i,1);else draft.allergies.push(v);}render();break;
  case'rmcustom':draft.custom.splice(+v,1);render();break;
  case'submit':{if(!ready(draft))return;const t=todayISO();
   S.profile=Object.assign(profileFields(draft),{created:t,planFrom:t});S.menus={};S.checks={};GENKEY='';persist();menuFor(t);
   openField=null;splash=true;tab='today';stack=[];render();setTimeout(()=>{splash=false;draft=null;render();},1300);break;}
  case'save':{if(!ready(draft))return;const t=todayISO();menuFor(t);
   S.profile=Object.assign(profileFields(draft),{created:S.profile.created,planFrom:addDays(t,1)});
   Object.keys(S.menus).forEach(k=>{if(k>t)delete S.menus[k];});GENKEY='';persist();draft=null;openField=null;render();toast('Saved. Your new plan starts tomorrow.');break;}
  case'resetask':sheet='reset';render();break;
  case'sheetclose':sheet=null;render();break;
  case'resetdo':S={profile:null,menus:{},checks:{}};persist();GEN=new Map();GENKEY='';draft=null;openField=null;sheet=null;stack=[];tab='today';render();break;
  case'copy':copyList();break;
  case'clear':S.checks={};persist();render();toast('Ticks cleared');break;
 }});
app.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='city-select'){draft.city=t.value;if(!S.profile&&t.value)openField=null;render();}
 else if(t.dataset&&t.dataset.tick){if(t.checked)S.checks[t.dataset.tick]=todayISO();else delete S.checks[t.dataset.tick];persist();refreshShopCounts();}});
app.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='custom-form'){const inp=document.getElementById('custom-allergy');const w=(inp.value||'').trim().slice(0,30);
  if(w&&draft.custom.indexOf(w)<0&&draft.custom.length<10)draft.custom.push(w);render();
  setTimeout(()=>{const i=document.getElementById('custom-allergy');if(i)i.focus();},0);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;render();}});

/* Keep "today" correct if the app stays open past midnight */
let lastDay=todayISO();
setInterval(()=>{const t=todayISO();if(t!==lastDay){lastDay=t;if(S.profile&&!stack.length&&!draft)render();}},60000);

/* Prune stored menus older than 90 days */
(function(){const cut=addDays(todayISO(),-90);let ch=false;Object.keys(S.menus).forEach(k=>{if(k<cut){delete S.menus[k];ch=true;}});if(ch)persist();})();

window.JainJoy={RECIPES,ING,tithiInfo,tithiName,genDay,hits,grocery,menuFor,get state(){return S;}};
render();
})();
</script>
